name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: Optional unused stable X.Y.Z version (main only)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Keep main builds and their release publication serialized; PRs may be replaced.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-policy:
    name: Release policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test version selection and publication safeguards
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
          python3 -B -m unittest discover -s .github/scripts/tests -v

  version:
    name: Select package version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Select stable version from tags and tested commit subject
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: python3 .github/scripts/next-version.py

  windows:
    needs: version
    name: Windows (primary)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Stamp tested package version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: python .github/scripts/next-version.py --stamp "$RELEASE_VERSION"

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@12.10.1 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r run build

      - name: Unit tests
        run: pnpm test:unit

      - name: Architecture tests
        run: pnpm test:architecture

      - name: Build host
        run: dotnet build src/dotnet/Refyntra.sln -c Release

      - name: Test host
        run: dotnet test src/dotnet/Refyntra.sln -c Release --no-build

      - name: Integration tests (Python/Rust on the bundled servers, no other extension)
        run: pnpm test:integration

      - name: Package VSIX (win32-x64; rust-analyzer downloaded at packaging time, SHA-256 verified)
        run: pnpm package:vsix

      - name: Audit VSIX
        run: pnpm audit:vsix

      - name: Install smoke (installed VSIX, clean profile, non-ASCII path)
        run: pnpm test:install

  ubuntu:
    needs: version
    name: Ubuntu (compile and unit only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Stamp tested package version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: python .github/scripts/next-version.py --stamp "$RELEASE_VERSION"

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.10.1 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r run build

      - name: Unit tests
        run: pnpm test:unit

      - name: Architecture tests
        run: pnpm test:architecture

      - name: Build host
        run: dotnet build src/dotnet/Refyntra.sln -c Release

      - name: Test host
        run: dotnet test src/dotnet/Refyntra.sln -c Release --no-build

  # One platform VSIX per target: identical except servers/rust-analyzer (the pinned, SHA-256-verified release binary
  # of that target, downloaded at packaging time only). The universal package carries no rust-analyzer.
  package:
    needs: version
    name: Package ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [win32-x64, win32-arm64, linux-x64, linux-arm64, alpine-x64, darwin-x64, darwin-arm64, universal]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Stamp tested package version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: python .github/scripts/next-version.py --stamp "$RELEASE_VERSION"

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.10.1 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build host
        run: dotnet build src/dotnet/Refyntra.sln -c Release

      - name: Package
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = universal ]; then
            pnpm package:vsix -- --target linux-x64 --universal
            pnpm audit:vsix -- --vsix dist/refyntra-${{ needs.version.outputs.version }}.vsix
          else
            pnpm package:vsix -- --target ${{ matrix.target }}
            pnpm audit:vsix -- --vsix dist/refyntra-${{ needs.version.outputs.version }}-${{ matrix.target }}.vsix
          fi

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: refyntra-vsix-${{ matrix.target }}
          # --universal also builds linux-x64; upload only this matrix entry's package.
          path: dist/refyntra-${{ needs.version.outputs.version }}${{ matrix.target != 'universal' && format('-{0}', matrix.target) || '' }}.vsix
          if-no-files-found: error


  verify-packages:
    name: Verify release VSIX set
    needs: [version, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: refyntra-vsix-*
          path: release-assets
          merge-multiple: true
      - name: Verify all eight versions, targets and SHA-256 checksums
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: python3 .github/scripts/publish-release.py verify release-assets "$RELEASE_VERSION"

  release:
    name: Publish GitHub Release
    needs: [release-policy, version, windows, ubuntu, package, verify-packages]
    if: >-
      github.repository == 'bitcodepro/Refyntra' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: refyntra-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: refyntra-vsix-*
          path: release-assets
          merge-multiple: true
      - name: Reverify assets and create tag and release without overwriting
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: python3 .github/scripts/publish-release.py publish release-assets "$RELEASE_VERSION"
